name: Build Android APKs

on:
  push:
    branches: [main, master, release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build User and Worker APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies (packages/core)
        run: |
          cd mobile/packages/core
          flutter pub get

      - name: Build User App (Owner) APK
        run: |
          cd mobile/apps/user_app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../../PetWalk-UserApp-release.apk

      - name: Build Worker App (Walker) APK
        run: |
          cd mobile/apps/worker_app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../../PetWalk-WorkerApp-release.apk

      - name: Upload User App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetWalk-UserApp-release
          path: PetWalk-UserApp-release.apk
          retention-days: 14

      - name: Upload Worker App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetWalk-WorkerApp-release
          path: PetWalk-WorkerApp-release.apk
          retention-days: 14

      - name: Publish GitHub Release (on release branch)
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-release
          name: "PetWalk Mobile APK v0.1.0"
          body: |
            ### PetWalk Mobile Applications
            - **PetWalk-UserApp-release.apk**: Aplikasi Pemilik Hewan (Owner Discovery, Order & Chat)
            - **PetWalk-WorkerApp-release.apk**: Aplikasi Pet Walker (Worker KYC, Standby, Tracking & Payout)
          draft: false
          prerelease: false
          files: |
            PetWalk-UserApp-release.apk
            PetWalk-WorkerApp-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
