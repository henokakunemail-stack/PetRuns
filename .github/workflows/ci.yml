name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint "src/**/*.ts"

      - name: Test
        run: pnpm exec jest --ci

      - name: Integration & Scenario Tests
        run: node --test --experimental-strip-types test/phase1-foundation.runner.ts test/phase2-auth.runner.ts test/phase3-discovery.runner.ts test/chat.runner.ts test/phase4-instant-match.runner.ts test/phase5-service-execution.runner.ts test/phase6-reviews.runner.ts test/phase7-hardening-and-version.runner.ts test/live-scenario-simulation.runner.ts

  admin-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: pnpm exec next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
