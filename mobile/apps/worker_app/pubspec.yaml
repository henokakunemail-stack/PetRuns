name: petwalk_worker_app
description: PetWalk mobile app for workers.
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.0
  intl: ^0.19.0
  petwalk_core:
    path: ../../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true
